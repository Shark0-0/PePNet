data:
  path: ""
  pose_path: ""
  seed: 0
  dataset_name: MomoDataset
  dataset_module: momo
  pose_type: hmr
  frame_interval: 1
  add_points_around_pose:
    enabled: true
    edges_points: 50
    edges_points2: 64
    pose_edges: [[1, 3], [2, 4], [3, 5], [4, 6], [7, 8], [7, 9], [7, 10], [9, 11], [10, 12], [11, 13], [12, 14]]
  clip_len: 16
  num_points: 512

model:
  cpsout: 512
  mlp1: [64, 128, 256]
  mlp2: [512]
  name: imPSTMamba
  module_filename: sequence_mamba
  parameters:
    operator: +
    input_f: 0
    dim: [512]
    mlp_batch_norm: [false]
    mlp_activation: [false]
    depth: 5
    heads: 8
    dim_head: 64
    mlp_dim: 2048
    dropout1: 0.0
    dropout2: 0.5
    radius: 0.1
    nsamples: 16
    spatial_stride: 16
    temporal_kernel_size: 3
    temporal_stride: 2
  mamba_parameters:
    ordering: false
    center_local_k: 4
    bimamba_type: "v4"
    sorting_strategy: motion_priority
    trans_dim: 512
    depth: 12
    drop_path_rate: 0.1
    cls_dim: 30
    num_heads: 6
    group_size: 32
    num_group: 64
    encoder_dims: 1024
    rms_norm: false
    drop_path: 0.3
    drop_out: 0.0
    scan_mode: sequential
    sort_axes: [x, y, z]
    sort_orders: [asc, asc, asc]

training:
  batch_size: 144
  epochs: 120
  workers: 10
  learning_rate:
    initial: 0.01
    milestones: [30, 50]
    gamma: 0.1
    warmup_epochs: 10
  optimizer:
    type: SGD
    momentum: 0.9
    weight_decay: 0.0001
  print_freq: 10
  output_dir: ""
  resume: ""
  start_epoch: 0
